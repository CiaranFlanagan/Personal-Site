<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Not found</title>
    <!-- Standalone on purpose. Netlify serves this file directly for unmatched
         paths, so it must not depend on the bundle having loaded. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #22201e;
        --paper: #fdfbf6;
        --maroon: #6b1740;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--paper);
        color: var(--ink);
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 30rem;
        text-align: center;
      }
      .snapshot {
        background: #fff;
        padding: 0.5rem;
        border-radius: 2px;
        display: inline-block;
        transform: rotate(-1.5deg);
        box-shadow:
          0 1px 2px rgb(0 0 0 / 0.08),
          0 8px 24px rgb(0 0 0 / 0.08);
      }
      .snapshot img {
        display: block;
        width: 100%;
        max-width: 22rem;
        height: auto;
      }
      h1 {
        margin: 2.5rem 0 0;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0.75rem 0 0;
        color: rgb(34 32 30 / 0.6);
        font-size: 0.95rem;
      }
      a {
        display: inline-block;
        margin-top: 1.75rem;
        padding: 0.4rem 1rem;
        border: 1px solid rgb(34 32 30 / 0.15);
        border-radius: 999px;
        color: rgb(34 32 30 / 0.75);
        font-size: 0.875rem;
        text-decoration: none;
        transition:
          background-color 0.15s,
          border-color 0.15s,
          color 0.15s;
      }
      a:hover {
        background: var(--maroon);
        border-color: var(--maroon);
        color: var(--paper);
      }
    </style>
  </head>
  <body>
    <main>
      <span class="snapshot">
        <img src="/404.jpg" alt="Bryce Canyon, Utah" width="1200" height="900" />
      </span>
      <h1>Nothing here.</h1>
      <p>That page does not exist.</p>
      <a href="/">Back to the site</a>
    </main>
  </body>
</html>
